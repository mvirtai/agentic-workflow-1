# GitHub Actions CI/CD Configuration Template

name: CI — {{projectName}}

workflows:
  test:
    name: Test Suite
    triggers:
      - push: [main]
      - pull_request: [main]
    
    jobs:
      {{#language_go}}
      go-test:
        runs-on: ubuntu-latest
        strategy:
          matrix:
            go-version: ['1.21', '1.22']
        
        steps:
          - checkout
          - setup-go: ${{ matrix.go-version }}
          - run: go mod tidy && go mod verify
          - run: go vet ./...
          - run: go test -v -race -coverprofile=coverage.txt ./...
          - upload-coverage: codecov
      {{/language_go}}

      {{#language_python}}
      python-test:
        runs-on: ubuntu-latest
        strategy:
          matrix:
            python-version: ['3.9', '3.11', '3.12']
        
        steps:
          - checkout
          - setup-python: ${{ matrix.python-version }}
          - run: curl -LsSf https://astral.sh/uv/install.sh | sh
          - run: uv sync
          - run: uv run ruff check .
          - run: uv run pytest -v --cov=. --cov-report=xml
          - upload-coverage: codecov
      {{/language_python}}

      {{#language_node}}
      {{#language_react}}
      node-test:
        runs-on: ubuntu-latest
        strategy:
          matrix:
            node-version: ['18', '20', '22']
        
        steps:
          - checkout
          - setup-node: ${{ matrix.node-version }}
          - run: pnpm install --frozen-lockfile
          - run: pnpm lint
          - run: pnpm test --run
          - run: pnpm build
          - upload-coverage: codecov
      {{/language_react}}
      {{#language_node}}
      {{#not language_react}}
      node-test:
        runs-on: ubuntu-latest
        strategy:
          matrix:
            node-version: ['18', '20', '22']
        
        steps:
          - checkout
          - setup-node: ${{ matrix.node-version }}
          - run: pnpm install --frozen-lockfile
          - run: pnpm lint
          - run: pnpm test --run
          - run: pnpm build
          - upload-coverage: codecov
      {{/not}}
      {{/language_node}}

  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest
    
    steps:
      {{#language_go}}
      - checkout
      - setup-go: '1.22'
      - run: golangci-lint run ./...
      {{/language_go}}
      
      {{#language_python}}
      - checkout
      - setup-python: '3.11'
      - run: uv sync && uv run mypy .
      {{/language_python}}
      
      {{#language_node}}
      - checkout
      - setup-node: '20'
      - run: pnpm install --frozen-lockfile && pnpm type-check
      {{/language_node}}
      
      - name: Lint Markdown
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlint.json

coverage:
  enabled: true
  threshold: 90
  provider: codecov
  upload_on:
    - push_to_main
    - pull_request

